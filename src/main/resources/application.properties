spring.application.name=ajoloteygrulla

# Carga la contraseña desde application-local.properties
spring.profiles.active=local

# ==========================================
# Conexión a MySQL en la nube (Aiven)
# ==========================================
spring.datasource.url=jdbc:mysql://mysql-ajolote-grulla-ajolote-grulla.f.aivencloud.com:13751/ajolote_grulla?sslMode=REQUIRED&serverTimezone=America/Mexico_City
spring.datasource.username=avnadmin
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Configuración de JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true